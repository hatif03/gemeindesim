services:
  gemeindesim:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      LLM_NAME: ${LLM_NAME:-apertus-v1.5-70b}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://hackapertus.livemap.sh/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
    volumes:
      - ./data:/app/data:ro
