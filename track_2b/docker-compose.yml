services:
  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
      target: prod
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      LLM_NAME: ${LLM_NAME:-apertus-v1.5-70b}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://hackapertus.livemap.sh/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_CONCURRENCY: ${LLM_CONCURRENCY:-4}  # hosted gateway returns 429 above ~4 in flight (research E10)
      LLM_FALLBACK_NAME: ${LLM_FALLBACK_NAME:-apertus-v1.5-8b}
      LLM_VOICE_NAME: ${LLM_VOICE_NAME:-}  # optional: model for the report and the 1:1 chat
      SWARM: ${SWARM:-false}  # swarm graph is supported and measured (research final runs) but slower and not better; see docs
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8080}
    volumes:
      - ./data:/app/data:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
      target: prod
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
      - "${UI_ALT_PORT:-8080}:3000"  # set UI_ALT_PORT if 8080 is taken (make run fails otherwise)
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
